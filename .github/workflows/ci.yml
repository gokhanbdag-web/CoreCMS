name: CoreCMS CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  php-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, curl, pdo_sqlite
      - name: PHP syntax checks
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: CoreCMS smoke test
        run: php tests/smoke.php
      - name: Installer hardening regression tests
        run: php tests/installer-hardening.php
      - name: Core foundation tests
        run: php tests/core-foundation.php
      - name: Role and permission tests
        run: php tests/role-manager.php
      - name: Authentication session revalidation tests
        run: php tests/auth-session.php
      - name: Admin login rate limit tests
        run: php tests/auth-login-rate-limit.php
      - name: Application secret tests
        run: php tests/app-secret.php
      - name: Module lifecycle tests
        run: php tests/module-lifecycle.php
      - name: Module update and rollback tests
        run: php tests/module-update.php
      - name: Non-destructive module uninstall tests
        run: php tests/module-uninstall.php
      - name: Module runtime tests
        run: php tests/module-runtime.php
      - name: Demo package lifecycle tests
        run: php tests/demo-packages.php
      - name: Content manager tests
        run: php tests/content-manager.php
      - name: Forms and email template tests
        run: php tests/forms-email.php
      - name: Visual form translation editor tests
        run: php tests/form-translation-editor.php
      - name: Visual form builder tests
        run: php tests/form-builder.php
      - name: Form submissions inbox tests
        run: php tests/form-submissions-inbox.php
      - name: Public form rendering and submission tests
        run: php tests/form-public.php
      - name: Mail queue and notification tests
        run: php tests/mail-queue.php
      - name: SMTP transport tests
        run: php tests/smtp-transport.php
      - name: SMTP settings tests
        run: php tests/smtp-settings.php
      - name: SMTP test email validation tests
        run: php tests/smtp-test-email.php
      - name: Theme manager tests
        run: php tests/theme-manager.php
      - name: Site settings tests
        run: php tests/site-settings.php
      - name: Localization and translation tests
        run: php tests/localization.php
      - name: Media library tests
        run: php tests/media-library.php
      - name: Page body renderer tests
        run: php tests/page-body-renderer.php
      - name: Page revision tests
        run: php tests/page-revisions.php
      - name: Page editor workflow tests
        run: php tests/page-editor-workflow.php
      - name: Technical SEO tests
        run: php tests/technical-seo.php
      - name: SEO management tests
        run: php tests/seo-management.php
      - name: SEO bulk editor tests
        run: php tests/seo-bulk-editor.php
      - name: Real estate module tests
        run: php tests/real-estate-module.php
      - name: Real estate site shell tests
        run: php tests/real-estate-site-shell.php
      - name: Tourism module tests
        run: php tests/tourism-module.php
      - name: Hair salon module tests
        run: php tests/hair-salon-module.php

  mysql-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database-image: ['mysql:8.0', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.database-image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: corecms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql
      - name: Browser installer HTTP integration test
        run: php tests/installer-http-integration.php
        env:
          CORECMS_DB_HOST: 127.0.0.1
          CORECMS_DB_PORT: 3306
          CORECMS_DB_USER: root
          CORECMS_DB_PASSWORD: root
          CORECMS_INSTALL_TEST_DB: corecms_installer_http_test
      - name: Fresh install, module install and upgrade integration tests
        run: php tests/mysql-integration.php
        env:
          CORECMS_DB_HOST: 127.0.0.1
          CORECMS_DB_PORT: 3306
          CORECMS_DB_USER: root
          CORECMS_DB_PASSWORD: root
          CORECMS_DB_NAME: corecms_test
